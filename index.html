<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#E7E2D6; color:#2A2A28;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; }
  .shell { max-width:1120px; margin:24px auto; background:#F4F1EA; border-radius:14px;
    overflow:hidden; border:1px solid #D8D2C4; box-shadow:0 6px 24px rgba(27,44,79,.10); }

  /* ---- topbalk ---- */
  .top { display:flex; align-items:center; justify-content:space-between;
    background:#F4F1EA; padding:12px 20px; border-bottom:1px solid #E0D8C4; }
  .merk { display:flex; align-items:center; gap:12px; }
  .merk .n1 { font-size:15px; font-weight:600; color:#1B2C4F; }
  .merk .n2 { font-size:11px; color:#8A7F63; }
  .merk .n2:empty { display:none; }
  .top-rechts { display:flex; align-items:center; gap:12px; }
  .knop { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:7px 13px;
    border:1px solid #D8D2C4; border-radius:7px; background:#FBF8F0; color:#1B2C4F;
    cursor:pointer; font-family:inherit; text-decoration:none; }
  .knop:hover { background:#F0EBDF; }
  .knop-navy { background:#1B2C4F; color:#F4F1EA; border-color:#1B2C4F; }
  .knop-navy:hover { background:#24396a; }
  .avatar { width:30px; height:30px; border-radius:50%; background:#1B2C4F; color:#F4F1EA;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }

  /* ---- sectiebalk (alleen in beheer) ---- */
  .secties { display:flex; align-items:center; gap:24px; background:#F0EBDF;
    padding:9px 20px; border-bottom:1px solid #E0D8C4; font-size:12.5px; color:#3A3524; }
  .sec { display:flex; align-items:center; gap:6px; cursor:pointer; padding-bottom:3px; margin-bottom:-11px;
    border-bottom:2px solid transparent; }
  .sec:hover { color:#1B2C4F; }
  .sec.actief { color:#1B2C4F; font-weight:600; border-bottom-color:#C9A227; }
  .sec i { font-size:15px; }

  /* ================= ETALAGE ================= */
  .etalage { display:block; }
  .hero { padding:26px 28px 24px; position:relative; overflow:hidden;
    background:#1B2C4F; color:#F4F1EA; }
  .hero svg { position:absolute; right:-40px; bottom:-30px; width:260px; opacity:.13; }
  .hero .eyebrow { font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:#C9A227; margin-bottom:8px; }
  .hero h1 { font-size:24px; font-weight:600; max-width:24ch; line-height:1.15; margin-bottom:6px; }
  .hero p { font-size:14px; color:#C6D0E0; max-width:44ch; margin-bottom:16px; }
  .hero p:empty { display:none; margin:0; }
  .hero .knoppen { display:flex; gap:11px; flex-wrap:wrap; margin-top:14px; }
  .knop-goud { background:#C9A227; color:#1B2C4F; font-weight:600; border-color:#C9A227; }
  .knop-goud:hover { background:#D9B43A; }
  .knop-open { border-color:#3A4E75; color:#F4F1EA; background:transparent; }
  .knop-open:hover { background:#22375f; }

  .blok { padding:40px 28px; }
  .kop { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
  .kop span { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#C9A227; }
  .kop h2 { font-size:22px; color:#1B2C4F; font-weight:600; }
  .kop-sub { font-size:13px; color:#8A7F63; margin-bottom:24px; }

  .apps { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }

  /* ---- app-kiezer: menu links, detail rechts ---- */
  .app-kiezer { display:grid; grid-template-columns:200px 1fr; gap:20px; align-items:start; }
  .app-menu { display:flex; flex-direction:column; gap:8px; }
  .app-blok { display:flex; align-items:center; gap:10px; background:#FBF8F0; border:1px solid #E8E1D2;
    border-radius:10px; padding:11px 12px; cursor:pointer; text-align:left; font-family:inherit;
    transition:.14s; position:relative; }
  .app-blok:hover { background:#F0EBDF; }
  .app-blok.actief { border-color:#C9A227; background:#FBF8F0; }
  .app-blok.actief::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
    background:#C9A227; border-radius:0 2px 2px 0; }
  .app-blok .bi { width:32px; height:32px; flex:none; border-radius:8px; background:#F0EBDF;
    display:flex; align-items:center; justify-content:center; }
  .app-blok.actief .bi { background:#1B2C4F; }
  .app-blok .bi i { font-size:17px; color:#1B2C4F; }
  .app-blok.actief .bi i { color:#C9A227; }
  .app-blok .bn { font-size:13px; font-weight:600; color:#1B2C4F; line-height:1.2; }
  .app-blok .bs { font-size:10.5px; color:#8A7F63; }

  .app-detail { background:#FBF8F0; border:1px solid #E8E1D2; border-radius:13px; padding:26px;
    position:relative; overflow:hidden; min-height:220px; }
  .app-detail::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:#C9A227; }
  .app-detail .d-ik { width:48px; height:48px; border-radius:11px; background:#F0EBDF;
    display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .app-detail .d-ik i { font-size:26px; color:#1B2C4F; }
  .app-detail .d-merk { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#C9A227; margin-bottom:4px; }
  .app-detail h3 { font-size:22px; color:#1B2C4F; margin-bottom:6px; }
  .app-detail .d-kop { font-size:15px; color:#1B2C4F; font-weight:600; margin-bottom:10px; }
  .app-detail .d-tekst { font-size:14px; color:#5F5E5A; line-height:1.65; margin-bottom:18px; max-width:52ch; }
  .app-detail .d-voor { font-size:12px; color:#8A7F63; margin-bottom:20px; }
  .app-detail .d-onder { display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    border-top:1px solid #EFEADE; padding-top:18px; }
  .app-detail .d-prijs { font-size:13px; color:#8A7F63; }
  .app-detail .d-prijs b { color:#1B2C4F; font-size:19px; }
  .app-detail .d-prijs .per { font-size:13px; font-weight:400; color:#8A7F63; }
  .app-detail .d-tiers { font-size:11.5px; color:#8A7F63; margin-top:3px; }
  @media (max-width:640px){ .app-kiezer { grid-template-columns:1fr; }
    .app-menu { flex-direction:row; overflow-x:auto; } .app-blok { flex:none; } }
  .app { background:#FBF8F0; border:1px solid #E8E1D2; border-radius:13px; padding:20px;
    display:flex; flex-direction:column; position:relative; overflow:hidden; }
  .app::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:#C9A227; }
  .app .ik { width:40px; height:40px; border-radius:9px; background:#F0EBDF;
    display:flex; align-items:center; justify-content:center; margin-bottom:13px; }
  .app .ik i { font-size:21px; color:#1B2C4F; }
  .app h3 { font-size:17px; color:#1B2C4F; margin-bottom:2px; }
  .app .merkje { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#C9A227; margin-bottom:8px; }
  .app p { font-size:13px; color:#5F5E5A; flex:1; margin-bottom:15px; }
  .app .voet { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .app .prijs { font-size:13px; color:#8A7F63; }
  .app .prijs b { color:#1B2C4F; font-size:15px; }
  .pil { font-size:10.5px; padding:3px 9px; border-radius:5px; white-space:nowrap; }
  .pil-live { background:#E1F5EE; color:#0F6E56; }
  .pil-gratis { background:#F1EFE8; color:#5F5E5A; }
  .pil-bouw { background:#FAEEDA; color:#854F0B; }
  .app a.open { font-size:13px; color:#1B2C4F; text-decoration:none; font-weight:600;
    display:inline-flex; align-items:center; gap:4px; }
  .app a.open:hover { color:#C9A227; }

  .over { background:#EFE9DC; }
  .over p { font-size:15px; color:#4A4640; max-width:56ch; }

  .voetbalk { background:#1B2C4F; color:#A9B4C9; font-size:12.5px; padding:22px 28px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

  /* ================= BEHEER ================= */
  .beheer { display:none; }
  .beheer-body { display:flex; min-height:520px; }
  .zij { width:210px; flex:none; background:#F0EBDF; border-right:1px solid #E0D8C4;
    padding:14px 10px; display:flex; flex-direction:column; transition:width .16s; }
  .kiezer { position:relative; margin-bottom:14px; }
  .kiezer-lbl { font-size:10px; color:#8A7F63; text-transform:uppercase; letter-spacing:.1em; margin:0 0 6px 6px; }
  .kiezer-knop { width:100%; display:flex; align-items:center; gap:8px; background:#FBF8F0;
    border:1px solid #D8D2C4; border-radius:7px; padding:8px 9px; cursor:pointer; text-align:left; }
  .kiezer-knop .ini { width:26px; height:26px; flex:none; border-radius:6px; background:#1B2C4F;
    color:#F4F1EA; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
  .kiezer-knop .nm { font-size:12.5px; font-weight:600; color:#1B2C4F; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .zij nav { display:flex; flex-direction:column; gap:1px; }
  .zij-lbl { font-size:10px; color:#8A7F63; text-transform:uppercase; letter-spacing:.1em; margin:8px 0 4px 6px; }
  .zij nav button { text-align:left; padding:7px 9px; border-radius:6px; font-size:12.5px;
    display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer;
    font-family:inherit; color:#2A2A28; }
  .zij nav button:hover { background:#E4DED0; }
  .zij nav button.actief { background:rgba(201,162,39,.16); color:#1B2C4F; }
  .zij nav button i { font-size:16px; color:#8A7F63; }
  .zij-voet { margin-top:auto; }

  .hoofd { flex:1; padding:18px 22px; min-width:0; overflow:auto; }
  .hoofd-kop { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
  .hoofd-kop h1 { font-size:19px; color:#1B2C4F; font-weight:600; }
  .hoofd-kop .datum { font-size:12px; color:#8A7F63; margin-top:2px; }

  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .metric { background:#FBF8F0; border:1px solid #E8E1D2; border-radius:9px; padding:11px 13px; }
  .metric .l { font-size:11px; color:#8A7F63; }
  .metric .n { font-size:21px; font-weight:600; color:#1B2C4F; margin-top:2px; }
  .metric .s { font-size:10.5px; color:#A59A82; margin-top:1px; }

  .paneel { background:#FBF8F0; border:1px solid #E8E1D2; border-radius:9px; padding:12px 14px; margin-bottom:16px; }
  .paneel h2 { font-size:13px; color:#1B2C4F; margin-bottom:9px; }
  .sig { display:flex; gap:8px; align-items:flex-start; font-size:12px; line-height:1.5; margin-bottom:7px; }
  .sig:last-child { margin-bottom:0; }
  .sig i { flex:none; margin-top:1px; font-size:16px; }
  .sig.urgent i { color:#A32D2D; }
  .sig.let_op i { color:#854F0B; }
  .leeg { font-size:12px; color:#8A7F63; font-style:italic; }

  table { width:100%; border-collapse:collapse; background:#FBF8F0; border:1px solid #E8E1D2;
    border-radius:9px; overflow:hidden; }
  th { text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:#F4F1EA; background:#1B2C4F; padding:9px 11px; font-weight:600; white-space:nowrap; }
  td { padding:9px 11px; font-size:12.5px; border-bottom:1px solid #EFEADE; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#F6F2E8; }
  .t-naam { font-weight:600; color:#1B2C4F; }
  .t-sub { font-size:11px; color:#8A7F63; }
  .p-actief { background:#E1F5EE; color:#0F6E56; }
  .p-proef { background:#F1EFE8; color:#5F5E5A; }
  .p-stop { background:#FAE3E3; color:#A32D2D; }
  .p-let { background:#FAEEDA; color:#854F0B; }
  .balk { height:5px; background:#EDE7D8; border-radius:3px; overflow:hidden; width:74px; margin-top:3px; }
  .balk > i { display:block; height:100%; background:#C9A227; }
  .balk.vol > i { background:#A32D2D; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }

  /* ---- inlog ---- */
  .inlogvak { max-width:340px; margin:40px auto; background:#FBF8F0; border:1px solid #E8E1D2;
    border-radius:12px; padding:24px; }
  .inlogvak h2 { font-size:16px; color:#1B2C4F; margin-bottom:4px; }
  .inlogvak p { font-size:12px; color:#8A7F63; margin-bottom:18px; }
  .inlogvak label { display:block; font-size:11.5px; color:#8A7F63; margin-bottom:5px; }
  .inlogvak input { width:100%; padding:9px 11px; font-size:13px; font-family:inherit;
    border:1px solid #D8D2C4; border-radius:6px; background:#FFFDF8; color:#2A2A28; margin-bottom:13px; }
  .inlogvak input:focus { outline:none; border-color:#C9A227; }
  .breed { width:100%; justify-content:center; padding:10px; }
  .inlogfout { margin-top:12px; font-size:12px; color:#A32D2D; background:#FAE3E3;
    border:1px solid #F0C9C9; border-radius:6px; padding:9px 11px; }

  .melding { padding:30px; text-align:center; font-size:13px; color:#8A7F63; }
  .verborgen { display:none !important; }

  /* app-kiezer uitklap */
  .kiezer-lijst { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20;
    background:#FBF8F0; border:1px solid #D8D2C4; border-radius:8px; overflow:hidden;
    box-shadow:0 6px 20px rgba(27,44,79,.14); display:none; }
  .kiezer-lijst.open { display:block; }
  .kiezer-optie { display:flex; align-items:center; gap:8px; padding:9px 10px; cursor:pointer;
    font-size:12.5px; color:#1B2C4F; background:none; border:none; width:100%; text-align:left;
    font-family:inherit; }
  .kiezer-optie:hover { background:#F0EBDF; }
  .kiezer-optie .ini { width:24px; height:24px; flex:none; border-radius:6px; background:#1B2C4F;
    color:#F4F1EA; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:600; }
  .kiezer-optie.actief { background:rgba(201,162,39,.16); }
  .kiezer-knop .ti-chevron-down { transition:transform .15s; }
  .kiezer-knop.open-knop .ti-chevron-down { transform:rotate(180deg); }

  @media (max-width:720px){
    .shell { margin:0; border-radius:0; }
    .hero h1 { font-size:26px; }
    .beheer-body { flex-direction:column; }
    .zij { width:100%; border-right:none; border-bottom:1px solid #E0D8C4; }
    .zij nav { flex-direction:row; flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- ============ TOPBALK (altijd zichtbaar) ============ -->
  <div class="top">
    <div class="merk">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-label="Fluid Waves">
        <rect x="1" y="1" width="38" height="38" rx="8" fill="#1B2C4F"/>
        <path d="M7 16 q3.5 -5 7 0 t7 0 t7 0" fill="none" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M7 22 q3.5 -5 7 0 t7 0 t7 0" fill="none" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
        <path d="M7 28 q3.5 -5 7 0 t7 0 t7 0" fill="none" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round" opacity=".4"/>
      </svg>
      <div>
        <div class="n1">Fluid Waves</div>
        <div class="n2" id="merkOnder"></div>
      </div>
    </div>
    <div class="top-rechts" id="topRechts">
      <button class="knop" id="beheerKnop" onclick="naarBeheer()"><i class="ti ti-lock" aria-hidden="true"></i>Beheer</button>
    </div>
  </div>

  <!-- ============ SECTIEBALK (alleen in beheer) ============ -->
  <div class="secties verborgen" id="sectiebalk"></div>

    <!-- ============ ETALAGE ============ -->
  <div class="etalage" id="etalage">
    <div class="hero">
      <svg viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 100 q40 -40 80 0 t80 0 t80 0 t80 0" fill="none" stroke="#C9A227" stroke-width="2"/>
        <path d="M0 130 q40 -40 80 0 t80 0 t80 0 t80 0" fill="none" stroke="#C9A227" stroke-width="1.4"/>
        <path d="M0 160 q40 -40 80 0 t80 0 t80 0 t80 0" fill="none" stroke="#C9A227" stroke-width="1"/>
      </svg>
      <div class="eyebrow" id="heroEyebrow"></div>
      <h1 id="heroTitel"></h1>
      <p id="heroOnder"></p>
      <div class="knoppen">
        <a href="#apps" class="knop knop-goud">Bekijk de apps<i class="ti ti-arrow-down" aria-hidden="true"></i></a>
        <a href="#over" class="knop knop-open">Over</a>
      </div>
    </div>

    <div class="blok" id="apps">
      <div class="kop"><h2 id="appsKop"></h2></div>
      <p class="kop-sub" id="appsOnder"></p>
      <div class="app-kiezer" id="appKiezer">
        <div class="app-menu" id="appMenu"><div class="melding">Laden…</div></div>
        <div class="app-detail" id="appDetail"></div>
      </div>
    </div>

    <div class="blok over" id="over">
      <div class="kop"><span>02</span><h2 id="overKop"></h2></div>
      <p id="overTekst"></p>
    </div>

    <div class="voetbalk">
      <div id="voetTekst"></div>
      <div>Wassenaar, NL</div>
    </div>
  </div>

  <!-- ============ BEHEER ============ -->
  <div class="beheer" id="beheer">

    <!-- inlog -->
    <div id="inlog">
      <div class="inlogvak">
        <h2>Beheer</h2>
        <p>Log in om klanten, prijzen en gebruik te beheren.</p>
        <label for="bEmail">E-mail</label>
        <input id="bEmail" type="email" autocomplete="username" placeholder="naam@voorbeeld.nl">
        <label for="bWw">Wachtwoord</label>
        <input id="bWw" type="password" autocomplete="current-password" placeholder="••••••••">
        <button class="knop knop-navy breed" id="bInlog">Inloggen</button>
        <div id="inlogFout" class="inlogfout verborgen"></div>
        <p style="margin-top:14px;"><a href="#" onclick="naarEtalage();return false;" style="color:#8A7F63;font-size:12px;">← terug naar de etalage</a></p>
      </div>
    </div>

    <!-- dashboard -->
    <div class="beheer-body verborgen" id="beheerBody">
      <aside class="zij">
        <div class="kiezer">
          <div class="kiezer-lbl">App in beeld</div>
          <button class="kiezer-knop" id="appKnop" onclick="toggleAppKiezer(event)">
            <span class="ini" id="appIni">JR</span>
            <span class="nm" id="appNaam">Job Radar</span>
            <i class="ti ti-chevron-down" style="font-size:15px;color:#8A7F63;margin-left:auto;" aria-hidden="true"></i>
          </button>
          <div class="kiezer-lijst" id="appLijst"></div>
        </div>
        <div class="zij-lbl">Beheer</div>
        <nav id="zijNav"></nav>
        <div class="zij-voet">
          <button class="knop breed" onclick="uitloggen()"><i class="ti ti-logout" aria-hidden="true"></i>Uitloggen</button>
        </div>
      </aside>

      <main class="hoofd">
        <div class="hoofd-kop">
          <div>
            <h1 id="hoofdTitel">Klanten</h1>
            <div class="datum" id="hoofdDatum"></div>
          </div>
          <button class="knop" onclick="laadBeheer()"><i class="ti ti-refresh" aria-hidden="true"></i>Ververs</button>
        </div>
        <div id="hoofdInhoud"><div class="melding">Laden…</div></div>
      </main>
    </div>
  </div>
</div>

<script>
const T = window.FW_TEKST;
const cfg = window.SUPABASE_CONFIG || null;
let sb = null;
let beheerToken = null;
let huidigeApp = "job-radar";
let laatsteData = null;

// ---- teksten invullen ----
document.getElementById("heroEyebrow").textContent = T.hero_eyebrow;
document.getElementById("heroTitel").textContent = T.hero_titel;
document.getElementById("heroOnder").textContent = T.hero_onder;
document.getElementById("appsKop").textContent = T.apps_kop;
document.getElementById("appsOnder").textContent = T.apps_onder;
document.getElementById("overKop").textContent = T.over_kop;
document.getElementById("overTekst").textContent = T.over_tekst;
document.getElementById("voetTekst").textContent = T.voet;

const ikonen = { "job-radar":"ti-radar", "tenderlead":"ti-file-search", "golf-score":"ti-golf", "live-from":"ti-playlist" };
const euro = c => "€ " + (c/100).toFixed(0);
const euroF = b => "€ " + Number(b||0).toFixed(2).replace(".",",");
const datumNL = d => d ? new Date(d).toLocaleDateString("nl-NL",{day:"2-digit",month:"short",year:"numeric"}) : "—";

// ================= OPSLAG =================
function kiesOpslag() {
  const werkt = o => { try { o.setItem("__t__","1"); const r=o.getItem("__t__")==="1"; o.removeItem("__t__"); return r; } catch(e){ return false; } };
  if (window.localStorage && werkt(window.localStorage)) return window.localStorage;
  if (window.sessionStorage && werkt(window.sessionStorage)) return window.sessionStorage;
  const m = new Map();
  return { getItem:k=>m.has(k)?m.get(k):null, setItem:(k,v)=>{m.set(k,String(v));}, removeItem:k=>{m.delete(k);} };
}
function maakClient() {
  if (!cfg) return false;
  if (!sb) sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false,
           storage:kiesOpslag(), storageKey:"fluidwaves-beheer" }
  });
  return true;
}

// ================= NAVIGATIE ETALAGE <-> BEHEER =================
function naarBeheer() {
  document.getElementById("etalage").classList.add("verborgen");
  document.getElementById("beheer").style.display = "block";
  document.getElementById("beheerKnop").classList.add("verborgen");
  proefInlog();
}
function naarEtalage() {
  document.getElementById("beheer").style.display = "none";
  document.getElementById("etalage").classList.remove("verborgen");
  document.getElementById("sectiebalk").classList.add("verborgen");
  document.getElementById("beheerKnop").classList.remove("verborgen");
}

// probeer een bestaande sessie; anders inlogscherm
async function proefInlog() {
  if (!maakClient()) { toonInlog(); return; }
  try {
    const { data } = await sb.auth.getSession();
    if (data.session?.access_token) { beheerToken = data.session.access_token; toonDashboard(); return; }
  } catch(e){}
  toonInlog();
}
function toonInlog() {
  document.getElementById("inlog").classList.remove("verborgen");
  document.getElementById("beheerBody").classList.add("verborgen");
  document.getElementById("sectiebalk").classList.add("verborgen");
  const e = document.getElementById("bEmail"); if (e && !e.value) e.focus();
}
function toonDashboard() {
  document.getElementById("inlog").classList.add("verborgen");
  document.getElementById("beheerBody").classList.remove("verborgen");
  document.getElementById("sectiebalk").classList.remove("verborgen");
  bouwAppLijst();
  bouwSecties();
  const a = BEHEER_APPS[huidigeApp] || BEHEER_APPS["job-radar"];
  beheerSectie(a.standaard);
}

async function inloggen() {
  const knop = document.getElementById("bInlog");
  const email = document.getElementById("bEmail").value.trim();
  const ww = document.getElementById("bWw").value;
  const fout = document.getElementById("inlogFout");
  fout.classList.add("verborgen");
  if (!email || !ww) { fout.textContent="Vul e-mail en wachtwoord in."; fout.classList.remove("verborgen"); return; }
  if (!maakClient()) return;
  knop.disabled = true; knop.textContent = "Bezig…";
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password:ww });
    if (error || !data.session) {
      fout.textContent = error?.message==="Invalid login credentials" ? "E-mail of wachtwoord klopt niet." : (error?.message||"Inloggen mislukt.");
      fout.classList.remove("verborgen"); return;
    }
    beheerToken = data.session.access_token;
    document.getElementById("bWw").value = "";
    toonDashboard();
  } catch(e) { fout.textContent="Inloggen mislukt: "+e.message; fout.classList.remove("verborgen"); }
  finally { knop.disabled=false; knop.textContent="Inloggen"; }
}
async function uitloggen() {
  beheerToken = null;
  try { if (sb) await sb.auth.signOut(); } catch(e){}
  naarEtalage();
}

// ================= ETALAGE: apps laden =================
let etalageApps = [];
let etalagePrijzen = [];

// prijsregel voor een app: goedkoopste betaalde tier, of gratis
function appPrijs(app) {
  const mijn = etalagePrijzen.filter(t => t.app_id === app.id);
  const gratis = mijn.find(t => t.prijs_cent === 0);
  const betaald = mijn.filter(t => t.prijs_cent > 0).sort((a,b)=>a.prijs_cent-b.prijs_cent);
  if (betaald.length) {
    const b = betaald[0];
    const per = b.interval==="jaar"?"jaar":b.interval==="eenmalig"?"":"mnd";
    return { kort: `vanaf ${euro(b.prijs_cent)}`, groot:`<b>${euro(b.prijs_cent)}</b>${per?`<span class="per">/${per}</span>`:""}`,
             tiers: mijn };
  }
  if (gratis) return { kort:"Gratis", groot:"<b>Gratis</b>", tiers: mijn };
  return { kort: app.status==="live"?"live":"binnenkort", groot:"", tiers: [] };
}

// linkermenu opbouwen
function bouwMenu() {
  const menu = document.getElementById("appMenu");
  menu.innerHTML = etalageApps.map(a => {
    const ik = ikonen[a.id] || "ti-app-window";
    const p = appPrijs(a);
    return `<button class="app-blok" data-app="${a.id}" onclick="kiesApp('${a.id}')">
      <span class="bi"><i class="ti ${ik}" aria-hidden="true"></i></span>
      <span><span class="bn">${a.naam}</span><br><span class="bs">${p.kort}</span></span>
    </button>`;
  }).join("");
}

// detail van één app rechts tonen
function kiesApp(id) {
  const app = etalageApps.find(a => a.id === id);
  if (!app) return;
  document.querySelectorAll(".app-blok").forEach(b => b.classList.toggle("actief", b.dataset.app===id));

  const ik = ikonen[app.id] || "ti-app-window";
  const uit = (window.FW_APP_UITLEG && window.FW_APP_UITLEG[app.id]) || {};
  const p = appPrijs(app);
  const merk = app.merknaam ? `<div class="d-merk">${app.merknaam}</div>` : "";

  // tiers-overzicht: alle vormen met hun prijs
  let tiersRegel = "";
  if (p.tiers.length) {
    tiersRegel = `<div class="d-tiers">` + p.tiers
      .sort((a,b)=>a.prijs_cent-b.prijs_cent)
      .map(t => {
        const per = t.interval==="jaar"?"/jaar":t.interval==="eenmalig"?"":t.interval==="gratis"?"":"/mnd";
        const prijs = t.prijs_cent===0 ? "gratis" : euro(t.prijs_cent)+per;
        const scans = t.scans_per_periode ?? t.scans_totaal;
        return `${t.naam}: ${prijs}${scans?` · ${scans} scans`:""}`;
      }).join(" &nbsp;·&nbsp; ") + `</div>`;
  }

  const kanOpen = app.url && app.status === "live";
  const startKnop = kanOpen
    ? `<a href="${app.url}" target="_blank" rel="noopener" class="knop knop-navy"><i class="ti ti-player-play" aria-hidden="true"></i>Start deze app</a>`
    : `<span class="pil pil-bouw">binnenkort beschikbaar</span>`;

  document.getElementById("appDetail").innerHTML = `
    <div class="d-ik"><i class="ti ${ik}" aria-hidden="true"></i></div>
    ${merk}<h3>${app.naam}</h3>
    ${uit.kop ? `<div class="d-kop">${uit.kop}</div>` : ""}
    <div class="d-tekst">${uit.tekst || app.omschrijving || ""}</div>
    ${uit.voor ? `<div class="d-voor">${uit.voor}</div>` : ""}
    <div class="d-onder">
      ${p.groot ? `<div><div class="d-prijs">${p.groot}</div>${tiersRegel}</div>` : ""}
      ${startKnop}
    </div>`;
}

async function laadApps() {
  const menu = document.getElementById("appMenu");
  if (!cfg) { menu.innerHTML='<div class="melding">Configuratie ontbreekt.</div>'; return; }
  try {
    const c = window.supabase.createClient(cfg.url, cfg.anonKey);
    const [apps, prijzen] = await Promise.all([
      c.from("catalogus").select("*").order("volgorde"),
      c.from("prijslijst").select("*")
    ]);
    if (apps.error) throw apps.error;
    etalageApps = apps.data || [];
    etalagePrijzen = prijzen.data || [];
    if (!etalageApps.length) { menu.innerHTML='<div class="melding">Nog geen apps.</div>'; return; }
    bouwMenu();
    kiesApp(etalageApps[0].id);
  } catch(e) { console.error(e); menu.innerHTML='<div class="melding">Apps konden niet laden.</div>'; }
}

// ================= BEHEER: gegevens =================
async function laadBeheer() {
  if (!beheerToken) { toonInlog(); return; }
  document.getElementById("hoofdInhoud").innerHTML = '<div class="melding">Laden…</div>';
  try {
    const res = await fetch("/api/beheer", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ accessToken: beheerToken, appId: huidigeApp })
    });
    if (res.status===401) { beheerToken=null; try{await sb.auth.signOut();}catch(e){} toonInlog(); return; }
    if (res.status===403) { beheerToken=null; document.getElementById("hoofdInhoud").innerHTML='<div class="melding">Dit account heeft geen beheerrechten.</div>'; return; }
    if (!res.ok) { const e=await res.json().catch(()=>({})); document.getElementById("hoofdInhoud").innerHTML=`<div class="melding">Kon niet laden: ${e.error||res.status}</div>`; return; }
    laatsteData = await res.json();
    beheerSectie(document.querySelector('#zijNav button.actief')?.dataset.v || BEHEER_APPS[huidigeApp]?.standaard || "klanten");
  } catch(e) { document.getElementById("hoofdInhoud").innerHTML=`<div class="melding">Verbinding mislukt.</div>`; }
}

function beheerSectie(naam) {
  document.querySelectorAll('.secties .sec, #zijNav button').forEach(b=>{
    const actief = (b.dataset.v||b.dataset.sec)===naam;
    b.classList.toggle('actief', actief);
  });
  const titels = { klanten:"Klanten", prijzen:"Prijzen en tiers", apps:"Apps", tableart:"Table Art" };
  document.getElementById("hoofdTitel").textContent = titels[naam] || "Beheer";

  // TAF haalt zijn eigen gegevens op via /api/taf-beheer.
  if (naam==="tableart") { toonTableArt(); return; }

  // Job Radar-secties leunen op de gedeelde laatsteData van /api/beheer.
  if (!laatsteData) { laadBeheer(); return; }
  if (naam==="klanten") toonKlanten(laatsteData);
  else if (naam==="prijzen") toonPrijzen(laatsteData);
  else if (naam==="apps") toonApps(laatsteData);
}

function toonKlanten(d) {
  const c = d.cijfers||{}, kl = d.klanten||[], sig = d.signalen||[];
  document.getElementById("hoofdDatum").textContent =
    `${kl.length} ${kl.length===1?"klant":"klanten"} · ${c.scans_deze_maand||0} scans deze maand`;
  const marge = (c.mrr_cent||0)/100 - Number(c.kosten_maand_eur||0);

  const metrics = `<div class="metrics">
    <div class="metric"><div class="l">Actieve klanten</div><div class="n">${c.klanten_actief||0}</div><div class="s">${c.betalend||0} betalend · ${c.proef||0} proef</div></div>
    <div class="metric"><div class="l">Terugkerende omzet</div><div class="n">${euro(c.mrr_cent||0)}</div><div class="s">per maand</div></div>
    <div class="metric"><div class="l">Kosten</div><div class="n">${euroF(c.kosten_maand_eur)}</div><div class="s">marge ${euroF(marge)}</div></div>
    <div class="metric"><div class="l">Scans deze maand</div><div class="n">${c.scans_deze_maand||0}</div><div class="s">${c.scans_vandaag||0} vandaag</div></div>
  </div>`;

  const sigBlok = `<div class="paneel"><h2>Vraagt aandacht</h2>${
    sig.length ? sig.map(s=>`<div class="sig ${s.ernst}"><i class="ti ${s.ernst==="urgent"?"ti-alert-triangle":"ti-info-circle"}" aria-hidden="true"></i><span>${s.tekst}</span></div>`).join("")
    : '<div class="leeg">Niets bijzonders.</div>'}</div>`;

  const rijen = kl.length ? kl.map(k=>{
    const over = k.scans_limiet==null?null:Math.max(0,k.scans_limiet-k.scans_gebruikt);
    const deel = k.scans_limiet?Math.min(100,(k.scans_gebruikt/k.scans_limiet)*100):0;
    const pil = k.status==="betaling_mislukt"?'<span class="pil p-stop">betaling mislukt</span>'
      : !k.actief?'<span class="pil p-stop">verlopen</span>'
      : k.opgezegd?'<span class="pil p-let">opgezegd</span>'
      : k.status==="proef"?'<span class="pil p-proef">proef</span>':'<span class="pil p-actief">actief</span>';
    const tegoed = k.scans_limiet==null?'<span class="t-sub">onbeperkt</span>'
      : `${k.scans_gebruikt} van ${k.scans_limiet}${k.bundel_over>0?` <span class="t-sub">+${k.bundel_over}</span>`:""}
         <div class="balk${over<=3?" vol":""}"><i style="width:${deel}%"></i></div>`;
    return `<tr><td><div class="t-naam">${k.naam||"Onbekend"}</div><div class="t-sub">${k.email||(k.app_gebruiker||"").slice(0,8)+"…"}</div></td>
      <td>${k.tier||"—"}<div class="t-sub">${k.prijs_cent?euro(k.prijs_cent)+"/mnd":"gratis"}</div></td>
      <td>${pil}</td><td>${tegoed}</td>
      <td class="num">${euroF(k.kosten_maand)}<div class="t-sub">${euroF(k.kosten_totaal)} totaal</div></td></tr>`;
  }).join("") : `<tr><td colspan="5" class="melding">Nog geen klanten.</td></tr>`;

  // kostprijs per scan, met marge-advies dat live meerekent
  const kp = c.kostprijs_mediaan;
  const kostBlok = c.kostprijs_gemeten > 0 ? `<div class="paneel">
    <h2>Kostprijs per scan <span class="t-sub" style="font-weight:400">· 30 dagen, ${c.kostprijs_gemeten} scans</span></h2>
    <div class="metrics" style="margin-bottom:11px;">
      <div class="metric"><div class="l">Mediaan</div><div class="n">${euroF(kp)}</div><div class="s">hierop prijzen</div></div>
      <div class="metric"><div class="l">Gemiddeld</div><div class="n">${euroF(c.kostprijs_gemiddeld)}</div><div class="s">met uitschieters</div></div>
      <div class="metric"><div class="l">Zware scan</div><div class="n">${euroF(c.kostprijs_p90)}</div><div class="s">10% zit hoger</div></div>
    </div>
    <div style="font-size:12px;line-height:1.6;color:#5F5E5A;border-top:1px solid #EFEADE;padding-top:10px;">
      Bij ${euroF(kp)} mediaan kost 20 scans u <strong style="color:#1B2C4F;">${euroF(kp*20)}</strong>.
      Voor 50% marge vraagt u daarvoor <strong style="color:#1B2C4F;">${euroF(kp*40)}</strong>;
      voor 10 scans <strong style="color:#1B2C4F;">${euroF(kp*20)}</strong> bij ${euroF(kp*10)} kosten.
    </div></div>`
  : `<div class="paneel"><h2>Kostprijs per scan</h2>
     <div class="leeg">Nog geen gemeten scans. Verschijnt zodra er scans zijn met kostenregistratie.</div></div>`;

  document.getElementById("hoofdInhoud").innerHTML = metrics + sigBlok + kostBlok +
    `<table><thead><tr><th>Klant</th><th>Tier</th><th>Status</th><th>Tegoed</th><th class="num">Kosten</th></tr></thead><tbody>${rijen}</tbody></table>`;
}

function toonPrijzen(d) {
  document.getElementById("hoofdDatum").textContent = "Tarieven per app";
  const t = (d.tiers||[]);
  document.getElementById("hoofdInhoud").innerHTML = t.length
    ? `<table><thead><tr><th>App</th><th>Tier</th><th class="num">Prijs</th><th>Interval</th><th class="num">Scans</th></tr></thead><tbody>${
        t.map(x=>`<tr><td>${x.app_id}</td><td class="t-naam">${x.naam}</td><td class="num">${x.prijs_cent?euro(x.prijs_cent):"gratis"}</td><td>${x.interval}</td><td class="num">${x.scans_per_periode??x.scans_totaal??"—"}</td></tr>`).join("")
      }</tbody></table>`
    : '<div class="paneel"><div class="leeg">De prijslijst komt hier. Nog niet gekoppeld in het beheeroverzicht — te vullen wanneer je tiers gaat aanpassen.</div></div>';
}

function toonApps(d) {
  document.getElementById("hoofdDatum").textContent = "Apps in het platform";
  const a = d.apps || [];
  document.getElementById("hoofdInhoud").innerHTML = a.length
    ? `<table><thead><tr><th>App</th><th>Merk</th><th>Status</th><th>URL</th></tr></thead><tbody>${
        a.map(x=>`<tr><td class="t-naam">${x.naam}</td><td>${x.merknaam||"—"}</td><td>${x.status}</td><td class="t-sub">${x.url||"—"}</td></tr>`).join("")
      }</tbody></table>`
    : '<div class="paneel"><div class="leeg">De applijst komt hier.</div></div>';
}

// ===== App-kiezer links + functies per app in de bovenbalk =====
// Alleen apps met een echt beheerdashboard.
const BEHEER_APPS = {
  "job-radar": {
    ini: "JR", naam: "Job Radar",
    secties: [
      { v:"klanten", label:"Klanten", icoon:"ti-users" },
      { v:"prijzen", label:"Prijzen", icoon:"ti-tag" },
      { v:"apps",    label:"Apps",    icoon:"ti-apps" }
    ],
    standaard: "klanten"
  },
  "table-art": {
    ini: "TA", naam: "Table Art",
    secties: [
      { v:"tableart", label:"Collecties", icoon:"ti-palette" }
    ],
    standaard: "tableart"
  }
};

function bouwAppLijst() {
  const lijst = document.getElementById("appLijst");
  lijst.innerHTML = Object.entries(BEHEER_APPS).map(([id, a]) =>
    `<button class="kiezer-optie${id===huidigeApp?" actief":""}" onclick="kiesBeheerApp('${id}')">
       <span class="ini">${a.ini}</span>${a.naam}
     </button>`).join("");
}

function toggleAppKiezer(e){
  e.stopPropagation();
  document.getElementById("appLijst").classList.toggle("open");
  document.getElementById("appKnop").classList.toggle("open-knop");
}
// buiten de kiezer klikken sluit de lijst
document.addEventListener("click", (e) => {
  if (!e.target.closest(".kiezer")) {
    document.getElementById("appLijst")?.classList.remove("open");
    document.getElementById("appKnop")?.classList.remove("open-knop");
  }
});

function kiesBeheerApp(id) {
  const a = BEHEER_APPS[id]; if (!a) return;
  huidigeApp = id;
  document.getElementById("appIni").textContent = a.ini;
  document.getElementById("appNaam").textContent = a.naam;
  document.getElementById("appLijst").classList.remove("open");
  document.getElementById("appKnop").classList.remove("open-knop");
  bouwAppLijst();
  bouwSecties();                       // bovenbalk + zijmenu opnieuw voor deze app
  beheerSectie(a.standaard);           // open de eerste functie van de app
}

// De functie-knoppen (bovenbalk én zij-nav) opbouwen voor de gekozen app.
function bouwSecties() {
  const a = BEHEER_APPS[huidigeApp]; if (!a) return;
  const boven = document.getElementById("sectiebalk");
  const zij = document.getElementById("zijNav");
  const maakKnop = (s, klasse) =>
    `<${klasse==="sec"?"div":"button"} class="${klasse}" data-${klasse==="sec"?"sec":"v"}="${s.v}" onclick="beheerSectie('${s.v}')"><i class="ti ${s.icoon}" aria-hidden="true"></i>${s.label}</${klasse==="sec"?"div":"button"}>`;
  if (boven) boven.innerHTML = a.secties.map(s => maakKnop(s, "sec")).join("");
  if (zij)   zij.innerHTML   = a.secties.map(s => maakKnop(s, "v")).join("");
}

// ---- inlog-listeners ----
document.getElementById("bInlog").addEventListener("click", inloggen);
["bEmail","bWw"].forEach(id=>document.getElementById(id).addEventListener("keydown",e=>{ if(e.key==="Enter") inloggen(); }));


// ================= TABLE ART =================
let tafCollecties = null;

async function tafBeheer(payload) {
  const res = await fetch("/api/taf-beheer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ accessToken: beheerToken, ...payload })
  });
  if (res.status === 401) { beheerToken = null; try { await sb.auth.signOut(); } catch(e){} toonInlog(); throw new Error("niet ingelogd"); }
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error || res.status); }
  return res.json();
}

async function toonTableArt() {
  const doel = document.getElementById("hoofdInhoud");
  document.getElementById("hoofdDatum").textContent = "Collecties van alle bezoekers";
  doel.innerHTML = '<div class="melding">Laden…</div>';
  try {
    const d = await tafBeheer({ actie: "lijst" });
    tafCollecties = d.collecties || [];
    document.getElementById("hoofdDatum").textContent =
      `${d.aantal} ${d.aantal===1?"collectie":"collecties"}`;
    if (!tafCollecties.length) { doel.innerHTML = '<div class="paneel"><div class="leeg">Nog geen collecties gemaakt.</div></div>'; return; }

    doel.innerHTML = `<table><thead><tr>
        <th>Collectie</th><th>Voor</th><th>Input</th><th>Gewijzigd</th><th></th>
      </tr></thead><tbody>${
      tafCollecties.map(c => {
        const thumbs = (c.thumbnails||[]).slice(0,4).map(t =>
          `<img src="${t}" style="width:26px;height:26px;object-fit:cover;border-radius:4px;border:1px solid #E0D8C4;margin-right:2px;">`).join("");
        const palet = (c.palet||[]).slice(0,6).map(p =>
          `<span style="display:inline-block;width:12px;height:12px;background:${p.hex||p};border:1px solid rgba(0,0,0,.1);"></span>`).join("");
        return `<tr>
          <td><div class="t-naam">${c.titel||"Naamloos"}</div><div class="t-sub">${palet}</div></td>
          <td>${c.toepassing||"—"}</td>
          <td>${thumbs||'<span class="t-sub">—</span>'}</td>
          <td class="t-sub">${datumNL(c.gewijzigd)}</td>
          <td class="num">
            <button class="knop" onclick="tafOpen('${c.id}')"><i class="ti ti-eye"></i>Bekijk</button>
            <button class="knop" onclick="tafDownload('${c.id}')"><i class="ti ti-download"></i>Zip</button>
            <button class="knop" onclick="tafVerwijder('${c.id}')"><i class="ti ti-trash"></i></button>
          </td></tr>`;
      }).join("")
    }</tbody></table>
    <div id="tafDetail" style="margin-top:16px;"></div>`;
  } catch(e) {
    doel.innerHTML = `<div class="melding">Kon niet laden: ${e.message}</div>`;
  }
}

async function tafOpen(id) {
  const detail = document.getElementById("tafDetail");
  detail.innerHTML = '<div class="melding">Collectie laden…</div>';
  try {
    const d = await tafBeheer({ actie: "collectie", id });
    const c = d.collectie;
    const pats = c.patronen || [];
    const svg2uri = svg => "url(\"data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg).replace(/'/g,"%27").replace(/"/g,"%22") + "\")";
    detail.innerHTML = `<div class="paneel">
      <h2>${c.titel||"Naamloos"} <span class="t-sub" style="font-weight:400">· ${pats.length} dessins</span></h2>
      ${c.profiel && c.profiel.samenvatting ? `<p style="font-size:12.5px;color:#5F5E5A;margin-bottom:12px;">${c.profiel.samenvatting}</p>` : ""}
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;">
        ${pats.map(p => `<div style="border:1px solid #E8E1D2;border-radius:8px;overflow:hidden;background:#FBF8F0;">
          <div style="aspect-ratio:1;background-repeat:repeat;background-size:70px;${p.svg?`background-image:${svg2uri(p.svg)};`:""}"></div>
          <div style="padding:6px 8px;font-size:11px;color:#1B2C4F;font-weight:600;">${p.naam||""}</div>
        </div>`).join("")}
      </div>
    </div>`;
  } catch(e) {
    detail.innerHTML = `<div class="melding">Kon collectie niet laden: ${e.message}</div>`;
  }
}

async function tafDownload(id) {
  try {
    const d = await tafBeheer({ actie: "collectie", id });
    const c = d.collectie;
    if (!window.JSZip) {
      await new Promise((ok, mis) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
        s.onload = ok; s.onerror = () => mis(new Error("JSZip laadt niet"));
        document.head.appendChild(s);
      });
    }
    const zip = new JSZip();
    const veilig = (c.titel||"collectie").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    (c.patronen||[]).forEach((p, i) => {
      if (p.svg) zip.file(`${String(i+1).padStart(2,"0")}-${(p.naam||"dessin").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.svg`, p.svg);
    });
    zip.file("collectie.json", JSON.stringify({ titel:c.titel, profiel:c.profiel, patronen:(c.patronen||[]).map(p=>({naam:p.naam,soort:p.soort,beschrijving:p.beschrijving,herkomst:p.herkomst,palet:p.palet,toepassing:p.toepassing,schaal:p.schaal})) }, null, 2));
    const blob = await zip.generateAsync({ type:"blob" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = veilig + ".zip"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  } catch(e) {
    alert("Downloaden mislukt: " + e.message);
  }
}

async function tafVerwijder(id) {
  if (!confirm("Deze collectie verwijderen? Dit kan niet ongedaan worden gemaakt.")) return;
  try {
    await tafBeheer({ actie: "verwijder", id });
    toonTableArt();
  } catch(e) {
    alert("Verwijderen mislukt: " + e.message);
  }
}
